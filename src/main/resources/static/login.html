<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurisGuide - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" stroke="#2C3E50" stroke-width="2"/>
                <path d="M20 8 L20 32 M8 20 L32 20" stroke="#2C3E50" stroke-width="2"/>
            </svg>
            <h1>TurisGuide</h1>
        </div>

        <h2>Faça Login na sua Conta</h2>

        <form id="loginForm">
            <div class="input-group">
                <span class="icon">✉️</span>
                <input type="text" placeholder="Email ou Nome de Usuário" required>
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" placeholder="Senha" required>
                <a href="#" class="forgot-password">Esqueceu sua senha?</a>
            </div>

            <div class="input-group user-type">
                <label class="checkbox-container">
                    <input type="checkbox" id="isProvider" name="userType">
                    <span class="checkmark">✓</span>
                    Entrar como Provedor de Serviços
                </label>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>

            <div class="divider">ou</div>

            <div class="social-login">
                <button type="button" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Login com Google
                </button>
                <button type="button" class="btn-facebook">
                    <span class="fb-icon">f</span>
                    Login com Facebook
                </button>
            </div>

            <p class="signup-link">
                Não tem una conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </form>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
