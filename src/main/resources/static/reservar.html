<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Reserva - TurisGuide</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .booking-container { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .main-service { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .suggestions { background: #f8f9fa; padding: 20px; border-radius: 15px; }
        .suggestion-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; cursor: pointer; border: 1px solid #eee; }
        .suggestion-card:hover { border-color: #667eea; }
        .payment-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-pay { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="logo"><span>TurisGuide</span></div>
        </div>
    </nav>

    <div class="booking-container">
        <!-- Coluna Esquerda: Detalhes e Pagamento -->
        <div class="main-service">
            <h1 id="serviceTitle">Carregando...</h1>
            <p id="serviceLoc">...</p>
            <div style="margin: 20px 0; font-size: 1.5rem; color: #27ae60;" id="servicePrice"></div>
            
            <form id="bookingForm">
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex:1">
                        <label>Check-in / Data</label>
                        <input type="date" id="checkIn" required>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Check-out (se aplicável)</label>
                        <input type="date" id="checkOut">
                    </div>
                </div>
                <div class="form-group">
                    <label>Hóspedes / Participantes</label>
                    <input type="number" id="guests" value="1" min="1" required>
                </div>

                <div class="payment-section">
                    <h3>Pagamento</h3>
                    <div class="form-group">
                        <label>Método de Pagamento</label>
                        <select id="paymentMethod">
                            <option value="PIX">PIX (Instantâneo)</option>
                            <option value="CREDITO">Cartão de Crédito</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-pay">Pagar e Reservar</button>
                </div>
            </form>
        </div>

        <!-- Coluna Direita: Sugestões (Cross-selling) -->
        <div class="suggestions">
            <h3>Complete sua viagem</h3>
            <p>Sugestões baseadas na sua escolha:</p>
            <div id="suggestionsList">
                <!-- Lista de sugestões (Hoteis ou Passeios) -->
            </div>
        </div>
    </div>

    <script src="js/reservar.js"></script>
</body>
</html>
