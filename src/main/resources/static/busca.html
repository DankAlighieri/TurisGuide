<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Serviços - TurisGuide</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .search-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            color: white;
            text-align: center;
        }
        .search-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .search-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }
        .filters-sidebar {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            height: fit-content;
            sticky: top;
        }
        .filters-sidebar h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2C3E50;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .filter-group {
            margin-bottom: 25px;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2C3E50;
        }
        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-filter {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-filter:hover {
            background: #5568d3;
        }
        .btn-clear {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #667eea;
            border: 1px solid #667eea;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .results-area {
            min-height: 400px;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .results-count {
            font-size: 1.1rem;
            color: #555;
        }
        .sort-select {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        .listing-card {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .listing-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .listing-img {
            width: 280px;
            height: 200px;
            object-fit: cover;
        }
        .listing-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .listing-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .listing-info h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #2C3E50;
        }
        .listing-location {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            margin-bottom: 10px;
        }
        .listing-price {
            font-size: 1.6rem;
            font-weight: bold;
            color: #27ae60;
        }
        .listing-price small {
            font-size: 0.7rem;
            color: #666;
            font-weight: normal;
        }
        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        .listing-description {
            color: #555;
            line-height: 1.5;
            margin-top: 10px;
        }
        .listing-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .listing-capacity {
            color: #666;
            font-size: 0.9rem;
        }
        .btn-reserve {
            padding: 10px 25px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-reserve:hover {
            background: #229954;
        }
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .no-results svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        @media (max-width: 968px) {
            .search-container {
                grid-template-columns: 1fr;
            }
            .filters-sidebar {
                position: static;
            }
            .listing-card {
                flex-direction: column;
            }
            .listing-img {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 8 L20 32 M8 20 L32 20" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>TurisGuide</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="pacotes.html">Pacotes</a></li>
                <li><a href="usuario-dashboard.html">Meu Painel</a></li>
            </ul>
        </div>
    </nav>

    <div class="search-header">
        <h1>🔍 Encontre seu Próximo Destino</h1>
        <p>Descubra experiências incríveis para sua viagem</p>
    </div>

    <div class="search-container">
        <!-- Barra Lateral de Filtros -->
        <aside class="filters-sidebar">
            <h3>Filtrar Resultados</h3>
            
            <div class="filter-group">
                <label>🔎 Pesquisar</label>
                <input type="text" id="filterSearch" placeholder="Nome ou localização">
            </div>

            <div class="filter-group">
                <label>📍 Localização</label>
                <input type="text" id="filterLocation" placeholder="Cidade ou região">
            </div>

            <div class="filter-group">
                <label>🏷️ Tipo de Serviço</label>
                <select id="filterType">
                    <option value="">Todos os tipos</option>
                    <option value="HOSPEDAGEM">Hospedagem</option>
                    <option value="PASSEIO">Passeio</option>
                    <option value="TRANSPORTE">Transporte</option>
                    <option value="ALIMENTACAO">Alimentação</option>
                    <option value="EVENTO">Evento</option>
                </select>
            </div>

            <div class="filter-group">
                <label>💰 Preço Máximo</label>
                <input type="number" id="filterMaxPrice" placeholder="R$ 0,00" min="0" step="10">
            </div>

            <div class="filter-group">
                <label>👥 Capacidade Mínima</label>
                <input type="number" id="filterCapacity" placeholder="Pessoas" min="1" value="1">
            </div>

            <button class="btn-filter" onclick="applyFilters()">Aplicar Filtros</button>
            <button class="btn-clear" onclick="clearFilters()">Limpar Filtros</button>
        </aside>

        <!-- Área de Resultados -->
        <div class="results-area">
            <div class="results-header">
                <div class="results-count">
                    <span id="resultsCount">Carregando...</span>
                </div>
                <select class="sort-select" id="sortBy" onchange="sortResults()">
                    <option value="relevance">Mais Relevantes</option>
                    <option value="price-asc">Menor Preço</option>
                    <option value="price-desc">Maior Preço</option>
                    <option value="name">Nome (A-Z)</option>
                </select>
            </div>
            
            <div id="resultsList">
                <p style="text-align: center; color: #999;">Carregando serviços...</p>
            </div>
        </div>
    </div>

    <script src="js/busca.js"></script>
</body>
</html>
