<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Reservas - TurisGuide</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .reservations-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 20px;
            color: white;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }
        .filters-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-item {
            flex: 1;
            min-width: 200px;
        }
        .filter-item label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2C3E50;
            font-size: 0.9rem;
        }
        .filter-item select,
        .filter-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .reservations-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .table-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h3 {
            font-size: 1.3rem;
            color: #2C3E50;
        }
        .reservation-card {
            border-bottom: 1px solid #f0f0f0;
            padding: 25px;
            transition: background 0.2s;
        }
        .reservation-card:hover {
            background: #f8f9fa;
        }
        .reservation-card:last-child {
            border-bottom: none;
        }
        .reservation-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .reservation-info h4 {
            font-size: 1.2rem;
            color: #2C3E50;
            margin-bottom: 8px;
        }
        .reservation-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #666;
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-badge.confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-badge.completed {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .reservation-details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #666;
            font-weight: 600;
        }
        .detail-value {
            color: #2C3E50;
        }
        .reservation-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-action {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .btn-confirm {
            background: #27ae60;
            color: white;
        }
        .btn-confirm:hover {
            background: #229954;
        }
        .btn-reject {
            background: #e74c3c;
            color: white;
        }
        .btn-reject:hover {
            background: #c0392b;
        }
        .btn-contact {
            background: #3498db;
            color: white;
        }
        .btn-contact:hover {
            background: #2980b9;
        }
        .btn-details {
            background: #95a5a6;
            color: white;
        }
        .btn-details:hover {
            background: #7f8c8d;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        @media (max-width: 768px) {
            .reservation-header {
                flex-direction: column;
                gap: 15px;
            }
            .reservation-actions {
                flex-wrap: wrap;
            }
            .btn-action {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 8 L20 32 M8 20 L32 20" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>TurisGuide - Prestador</span>
            </div>
            <ul class="nav-links">
                <li><a href="provedor-dashboard.html">Painel</a></li>
                <li><a href="gerenciar-reservas.html" class="active">Reservas</a></li>
                <li><a href="#" id="logoutBtn">Sair</a></li>
            </ul>
        </div>
    </nav>

    <div class="reservations-container">
        <div class="page-header">
            <h1>📅 Gerenciar Reservas</h1>
            <p>Acompanhe e gerencie todas as reservas dos seus serviços</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-label">Pendentes</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="statConfirmed">0</div>
                <div class="stat-label">Confirmadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎉</div>
                <div class="stat-value" id="statCompleted">0</div>
                <div class="stat-label">Concluídas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="statRevenue">R$ 0</div>
                <div class="stat-label">Receita Total</div>
            </div>
        </div>

        <div class="filters-bar">
            <div class="filter-item">
                <label>Status</label>
                <select id="filterStatus" onchange="applyFilters()">
                    <option value="">Todos</option>
                    <option value="PENDING">Pendentes</option>
                    <option value="CONFIRMED">Confirmadas</option>
                    <option value="COMPLETED">Concluídas</option>
                    <option value="CANCELLED">Canceladas</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Serviço</label>
                <select id="filterService" onchange="applyFilters()">
                    <option value="">Todos os Serviços</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Data Inicial</label>
                <input type="date" id="filterDateFrom" onchange="applyFilters()">
            </div>
            <div class="filter-item">
                <label>Data Final</label>
                <input type="date" id="filterDateTo" onchange="applyFilters()">
            </div>
        </div>

        <div class="reservations-table">
            <div class="table-header">
                <h3>Lista de Reservas</h3>
                <span id="resultsCount">0 reservas</span>
            </div>
            
            <div id="reservationsList">
                <p style="text-align: center; padding: 40px; color: #999;">Carregando reservas...</p>
            </div>
        </div>
    </div>

    <script src="js/gerenciar-reservas.js"></script>
</body>
</html>
