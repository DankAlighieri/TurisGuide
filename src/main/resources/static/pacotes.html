<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacotes Turísticos - TurisGuide</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .packages-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 80px 20px;
            color: white;
            text-align: center;
        }
        .packages-hero h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .packages-hero p {
            font-size: 1.2rem;
            opacity: 0.95;
        }
        .packages-container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 12px 30px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn:hover,
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        .package-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .package-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .package-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 10;
        }
        .package-badge.popular {
            background: #ffd93d;
            color: #2C3E50;
        }
        .package-badge.new {
            background: #27ae60;
        }
        .package-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            position: relative;
        }
        .package-content {
            padding: 25px;
        }
        .package-title {
            font-size: 1.5rem;
            color: #2C3E50;
            margin-bottom: 10px;
        }
        .package-duration {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .package-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .package-includes {
            margin-bottom: 20px;
        }
        .package-includes h4 {
            font-size: 1rem;
            color: #2C3E50;
            margin-bottom: 10px;
        }
        .includes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .include-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #555;
        }
        .package-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .package-price {
            display: flex;
            flex-direction: column;
        }
        .price-label {
            font-size: 0.8rem;
            color: #999;
        }
        .price-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #27ae60;
        }
        .btn-buy-package {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-buy-package:hover {
            background: #5568d3;
        }
        .no-packages {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }
        .create-package-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 60px 20px;
            text-align: center;
            color: white;
            margin-top: 60px;
        }
        .create-package-section h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .btn-create-package {
            padding: 15px 40px;
            background: white;
            color: #f5576c;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        .btn-create-package:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .packages-hero h1 {
                font-size: 2rem;
            }
            .packages-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 8 L20 32 M8 20 L32 20" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>TurisGuide</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="busca.html">Buscar Serviços</a></li>
                <li><a href="minhas-reservas.html">Minhas Reservas</a></li>
                <li><a href="usuario-dashboard.html">Meu Painel</a></li>
            </ul>
        </div>
    </nav>

    <div class="packages-hero">
        <h1>🎁 Pacotes Turísticos Exclusivos</h1>
        <p>Experiências completas com hospedagem, passeios e muito mais!</p>
    </div>

    <div class="packages-container">
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterPackages('all')">Todos</button>
            <button class="tab-btn" onclick="filterPackages('weekend')">Fim de Semana</button>
            <button class="tab-btn" onclick="filterPackages('week')">Semana</button>
            <button class="tab-btn" onclick="filterPackages('adventure')">Aventura</button>
            <button class="tab-btn" onclick="filterPackages('relax')">Relaxamento</button>
            <button class="tab-btn" onclick="filterPackages('family')">Família</button>
        </div>

        <div class="packages-grid" id="packagesGrid">
            <!-- Pacotes serão carregados aqui via JavaScript -->
        </div>
    </div>

    <div class="create-package-section">
        <h2>🚀 Prestador de Serviços?</h2>
        <p>Crie seus próprios pacotes turísticos e alcance mais clientes!</p>
        <button class="btn-create-package" onclick="location.href='provedor-dashboard.html'">
            Criar Meu Pacote
        </button>
    </div>

    <script src="js/pacotes.js"></script>
</body>
</html>
