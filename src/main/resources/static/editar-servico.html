<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Serviço - TurisGuide</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .edit-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .edit-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .edit-header {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .edit-header h1 {
            font-size: 2rem;
            color: #2C3E50;
            margin-bottom: 8px;
        }
        .edit-header p {
            color: #666;
        }
        .form-section {
            margin-bottom: 35px;
        }
        .form-section h3 {
            font-size: 1.2rem;
            color: #2C3E50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2C3E50;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .char-count {
            font-size: 0.85rem;
            color: #999;
            text-align: right;
            margin-top: 5px;
        }
        .image-preview {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .preview-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ddd;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px solid #f0f0f0;
        }
        .btn-save {
            flex: 1;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-save:hover {
            background: #229954;
        }
        .btn-cancel {
            padding: 15px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-cancel:hover {
            background: #c0392b;
        }
        .btn-delete {
            padding: 15px 30px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-delete:hover {
            background: #7f8c8d;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 8 L20 32 M8 20 L32 20" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>TurisGuide - Prestador</span>
            </div>
            <ul class="nav-links">
                <li><a href="provedor-dashboard.html">← Voltar ao Painel</a></li>
            </ul>
        </div>
    </nav>

    <div class="edit-container">
        <div class="edit-card">
            <div class="edit-header">
                <h1>✏️ Editar Serviço</h1>
                <p>Atualize as informações do seu serviço turístico</p>
            </div>

            <div id="loadingMessage" class="loading">
                <p>Carregando informações do serviço...</p>
            </div>

            <form id="editServiceForm" style="display: none;">
                <div class="form-section">
                    <h3>📋 Informações Básicas</h3>
                    
                    <div class="form-group">
                        <label for="serviceName">Nome do Serviço *</label>
                        <input type="text" id="serviceName" required maxlength="100">
                        <div class="char-count"><span id="nameCount">0</span>/100</div>
                    </div>

                    <div class="form-group">
                        <label for="serviceDescription">Descrição Detalhada *</label>
                        <textarea id="serviceDescription" required maxlength="500"></textarea>
                        <div class="char-count"><span id="descCount">0</span>/500</div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="serviceType">Tipo de Serviço *</label>
                            <select id="serviceType" required>
                                <option value="">Selecione...</option>
                                <option value="HOSPEDAGEM">🏨 Hospedagem</option>
                                <option value="PASSEIO">🎯 Passeio/Tour</option>
                                <option value="TRANSPORTE">🚗 Transporte</option>
                                <option value="ALIMENTACAO">🍽️ Alimentação</option>
                                <option value="EVENTO">🎉 Evento</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="serviceCapacity">Capacidade (pessoas) *</label>
                            <input type="number" id="serviceCapacity" required min="1" max="1000">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>📍 Localização</h3>
                    
                    <div class="form-group">
                        <label for="serviceLocation">Endereço Completo *</label>
                        <input type="text" id="serviceLocation" required placeholder="Rua, Número, Bairro, Cidade - Estado">
                    </div>
                </div>

                <div class="form-section">
                    <h3>💰 Precificação</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="servicePrice">Preço por Pessoa (R$) *</label>
                            <input type="number" id="servicePrice" required min="0" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="serviceDuration">Duração Estimada</label>
                            <input type="text" id="serviceDuration" placeholder="Ex: 2 horas, 3 dias">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>🖼️ Imagens</h3>
                    
                    <div class="form-group">
                        <label for="serviceImage">URL da Imagem Principal</label>
                        <input type="url" id="serviceImage" placeholder="https://exemplo.com/imagem.jpg">
                    </div>

                    <div class="image-preview" id="imagePreview"></div>
                </div>

                <div class="form-section">
                    <h3>ℹ️ Informações Adicionais</h3>
                    
                    <div class="form-group">
                        <label for="serviceAmenities">Comodidades / O que está incluído</label>
                        <textarea id="serviceAmenities" rows="3" placeholder="Ex: Wi-Fi gratuito, Café da manhã, Guia turístico..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="servicePolicies">Políticas de Cancelamento</label>
                        <textarea id="servicePolicies" rows="3" placeholder="Ex: Cancelamento grátis até 24h antes..."></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-save">💾 Salvar Alterações</button>
                    <button type="button" class="btn-delete" onclick="deleteService()">🗑️ Excluir</button>
                    <button type="button" class="btn-cancel" onclick="location.href='provedor-dashboard.html'">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/editar-servico.js"></script>
</body>
</html>
