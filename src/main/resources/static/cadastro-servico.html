<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Serviço - TurisGuide</title>
    <link rel="stylesheet" href="css/cadastro-servico.css">
</head>
<body>
<nav class="navbar">
    <div class="container-nav">
        <div class="logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                <path d="M20 8 L20 32 M8 20 L32 20" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>TurisGuide</span>
        </div>
        <ul class="nav-links">
            <li><a href="provedor-dashboard.html">← Voltar ao Painel</a></li>
        </ul>
    </div>
</nav>

<section class="form-section">
    <div class="container">
        <h1>Cadastrar Novo Serviço</h1>
        
        <form id="servicoForm" class="service-form">
            <div class="form-group">
                <label for="tipoServico">Tipo de Serviço *</label>
                <select id="tipoServico" required>
                    <option value="">Selecione...</option>
                    <option value="HOSPEDAGEM">Hospedagem</option>
                    <option value="TRANSPORTE">Transporte</option>
                    <option value="PASSEIO">Passeio/Tour</option>
                    <option value="RESTAURANTE">Restaurante</option>
                    <option value="EVENTO">Evento</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nome">Nome do Serviço *</label>
                <input type="text" id="nome" required placeholder="Ex: Hotel Praia Azul">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição *</label>
                <textarea id="descricao" required rows="4" placeholder="Descreva seu serviço..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="preco">Preço (R$) *</label>
                    <input type="number" id="preco" required min="0" step="0.01" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="capacidade">Capacidade *</label>
                    <input type="number" id="capacidade" required min="1" placeholder="Ex: 4">
                </div>
            </div>

            <div class="form-group">
                <label for="localizacao">Localização *</label>
                <input type="text" id="localizacao" required placeholder="Cidade, Estado">
            </div>

            <div class="form-group">
                <label for="endereco">Endereço Completo</label>
                <input type="text" id="endereco" placeholder="Rua, número, bairro">
            </div>

            <div class="form-group">
                <label for="imagem">URL da Imagem</label>
                <input type="url" id="imagem" placeholder="https://exemplo.com/imagem.jpg">
            </div>

            <div class="form-group">
                <label for="comodidades">Comodidades/Diferenciais</label>
                <textarea id="comodidades" rows="3" placeholder="Ex: Wi-Fi, Ar-condicionado, Café da manhã incluído"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="location.href='provedor-dashboard.html'">Cancelar</button>
                <button type="submit" class="btn-submit">Cadastrar Serviço</button>
            </div>
        </form>
    </div>
</section>

<script src="js/cadastro-servico.js"></script>
</body>
</html>
