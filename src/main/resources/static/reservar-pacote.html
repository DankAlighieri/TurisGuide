<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Pacote - TurisGuide</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .booking-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .package-details {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .package-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .package-header h1 {
            font-size: 2rem;
            color: #2C3E50;
            margin-bottom: 15px;
        }
        .package-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .package-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .package-description {
            color: #555;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        .package-includes {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .package-includes h3 {
            font-size: 1.2rem;
            color: #2C3E50;
            margin-bottom: 15px;
        }
        .includes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .include-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
        }
        .booking-form {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }
        .form-section h3 {
            font-size: 1.3rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2C3E50;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .btn-book {
            width: 100%;
            padding: 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn-book:hover {
            background: #229954;
        }
        .booking-summary {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .summary-title {
            font-size: 1.4rem;
            color: #2C3E50;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .price-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        .price-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .price-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .total-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #27ae60;
        }
        @media (max-width: 968px) {
            .booking-container {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .includes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 8 L20 32 M8 20 L32 20" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>TurisGuide</span>
            </div>
            <ul class="nav-links">
                <li><a href="pacotes.html">← Voltar aos Pacotes</a></li>
            </ul>
        </div>
    </nav>

    <div class="booking-container">
        <div class="package-details">
            <div class="package-header">
                <span class="package-badge" id="packageBadge">Pacote</span>
                <h1 id="packageTitle">Carregando...</h1>
                <p id="packageDuration" style="color: #666;">⏰ ...</p>
            </div>

            <img id="packageImage" src="" class="package-image" alt="Pacote">

            <p class="package-description" id="packageDescription">Carregando descrição...</p>

            <div class="package-includes">
                <h3>✨ O que está incluído</h3>
                <div class="includes-grid" id="includesList">
                    <!-- Itens incluídos -->
                </div>
            </div>

            <div class="booking-form">
                <h3>📝 Informações da Reserva</h3>
                <form id="bookingForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Data de Início *</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div class="form-group">
                            <label>Número de Pessoas *</label>
                            <input type="number" id="guests" value="1" min="1" max="20" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Observações / Solicitações Especiais</label>
                        <textarea id="observations" rows="3" placeholder="Ex: restrições alimentares, preferências..."></textarea>
                    </div>

                    <h3 style="margin-top: 30px;">💳 Pagamento</h3>
                    
                    <div class="form-group">
                        <label>Método de Pagamento *</label>
                        <select id="paymentMethod" required>
                            <option value="">Selecione...</option>
                            <option value="PIX">PIX (5% desconto)</option>
                            <option value="CREDITO">Cartão de Crédito</option>
                            <option value="BOLETO">Boleto Bancário</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-book">🔒 Confirmar Reserva do Pacote</button>
                </form>
            </div>
        </div>

        <aside>
            <div class="booking-summary">
                <h3 class="summary-title">Resumo da Reserva</h3>
                
                <div class="price-display">
                    <div class="price-label">Preço do Pacote</div>
                    <div class="price-value" id="packagePrice">R$ 0,00</div>
                    <div style="font-size: 0.85rem; opacity: 0.8;">por pessoa</div>
                </div>

                <div class="summary-item">
                    <span style="color: #666;">Pacote</span>
                    <span id="summaryPackage" style="font-weight: 600;">-</span>
                </div>
                <div class="summary-item">
                    <span style="color: #666;">Pessoas</span>
                    <span id="summaryGuests" style="font-weight: 600;">1</span>
                </div>
                <div class="summary-item">
                    <span style="color: #666;">Subtotal</span>
                    <span id="summarySubtotal" style="font-weight: 600;">R$ 0,00</span>
                </div>

                <div class="total-section">
                    <div class="total-row">
                        <span style="font-size: 1.1rem; font-weight: 600;">Total</span>
                        <span class="total-value" id="totalPrice">R$ 0,00</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="js/reservar-pacote.js"></script>
</body>
</html>
